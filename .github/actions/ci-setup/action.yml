name: Setup CI

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
      with:
        node-version-file: .node-version
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile
