name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: "Tests using Node ${{ matrix.node_version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
        with:
          node-version: ${{ matrix.node_version }}

      - name: Run Tests
        run: yarn test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup

      - name: Check Types
        run: yarn tsc

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup

      - name: Check Formatting
        run: yarn format:check

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup

      - name: Check Knip
        run: yarn knip
